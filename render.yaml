services:
  - type: web
    name: fuel-expense-tracker-api
    env: node
    region: oregon
    buildCommand: npm install
    startCommand: npm run start:server
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: "*" # Set this to your Netlify URL (e.g. https://your-app.netlify.app)
      - key: DATABASE_URL
        fromDatabase:
          name: fuel-expense-db
          property: connectionString

databases:
  - name: fuel-expense-db
    region: oregon
    plan: free
